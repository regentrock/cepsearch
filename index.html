<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Buscar CEP</title>
</head>
<body>
    <div class="container">
        <h1>Buscador de CEP</h1>
        <div class="form-group">
            <div class="input-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" placeholder="Digite o CEP" maxlength="8">
            </div>
            
            <div class="input-group">
                <label for="street">Logradouro</label>
                <input type="text" id="street" placeholder="Rua, Avenida, etc.">
            </div>
            
            <div class="input-group">
                <label for="number">Número</label>
                <input type="number" id="number" placeholder="Número">
            </div>
            
            <div class="input-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" placeholder="Bairro">
            </div>
            
            <div class="input-group">
                <label for="city">Cidade</label>
                <input type="text" id="city" placeholder="Cidade">
            </div>
            
            <div class="input-group">
                <label for="state">Estado</label>
                <input type="text" id="state" placeholder="Estado">
            </div>
            
            <div class="button-group">
                <button type="button" id="search" class="btn-search">
                    Buscar CEP
                    <span class="loading"></span>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
